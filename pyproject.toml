[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sas-rag-assistant"
version = "0.1.0"
description = "RAG-Powered SAS Code Reuse Assistant for Clinical Trials"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Chris"}
]

[project.urls]
Documentation = "docs/"

[tool.setuptools]
package-dir = {"" = "."}

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"
